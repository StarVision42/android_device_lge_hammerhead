name: Build Let'sgoOS (Android 17) by MikeSoft UA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Configure Git (MikeSoft UA)
      run: |
        git config --global user.name "MikeSoft UA Developer"
        git config --global user.email "mikesoft.ua@gmail.com"

    # Подключаем кэш. Если сборка запустится повторно, она пройдет в 3 раза быстрее
    - name: Setup Compiler Cache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-letsgoos-hammerhead-${{ github.sha }}
        restore-keys: |
          ccache-letsgoos-hammerhead-

    - name: Initialize Source Repo
      run: |
        mkdir android-src
        cd android-src
        repo init -u https://github.com -b lineage-24.0 --git-lfs --depth=1

    - name: Repo Sync
      run: |
        cd android-src
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree (Hammerhead)
      run: |
        cd android-src
        # Подтягиваем твое дерево устройств
        git clone https://github.com -b lineage-23.2 device/lge/hammerhead

    - name: Compile Let'sgoOS
      run: |
        cd android-src
        export USE_CCACHE=1
        export CCACHE_DIR=~/.ccache
        ccache -M 50G # Выделяем 50 ГБ под кэш компилятора
        
        source build/envsetup.sh
        lunch lineage_hammerhead_gms_go_2gb-userdebug
        mka bacon -j$(nproc --all)

    - name: Upload Let'sgoOS Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: LetsgoOS-Android17-Nexus5
        path: android-src/out/target/product/hammerhead/*.zip
